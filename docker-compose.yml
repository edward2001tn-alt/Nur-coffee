# Local/staging stack: PostgreSQL + web + worker. Not verified in the build session (no Docker there).
# Usage: cp .env.example .env (edit secrets) && docker compose up --build
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: nur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nur_local_dev}
      POSTGRES_DB: nur
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nur"]
      interval: 5s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nur:${POSTGRES_PASSWORD:-nur_local_dev}@db:5432/nur
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    depends_on: { db: { condition: service_healthy } }
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nur:${POSTGRES_PASSWORD:-nur_local_dev}@db:5432/nur
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nur:${POSTGRES_PASSWORD:-nur_local_dev}@db:5432/nur
    command: npx tsx worker/index.ts
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes:
  pgdata:
